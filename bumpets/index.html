<style>
:root{color-scheme:dark;--bg0:#0d2a4a;--gold:#f7b60c;--navy:#0d1430;--sky:#7ec8f5;
  --font:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:#fff;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
.hide,[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- site: barra de cima e banner embaixo (igual aos outros jogos) ---- */
:root{--topH:calc(48px + env(safe-area-inset-top,0px));--adH:calc(60px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px) and (min-height:640px){:root{--adH:calc(90px + env(safe-area-inset-bottom,0px))}}
#app{position:fixed;left:0;right:0;top:var(--topH);bottom:var(--adH);display:flex;align-items:center;justify-content:center;padding:4px max(0px,env(safe-area-inset-right,0px)) 4px max(0px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 80% at 50% 35%,#3f8fd0 0%,#1d5a92 50%,var(--bg0) 100%)}
#topbar{position:fixed;left:0;right:0;top:0;height:var(--topH);padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;background:var(--bg0);z-index:3}
#topbar .back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px 0 10px;border-radius:999px;text-decoration:none;
  font:700 17px/1 var(--font);color:#fff;background:#ffffff14;border:1.5px solid #ffffff38;transition:background .15s,border-color .15s,color .15s}
#topbar .back:hover,#topbar .back:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--navy);outline:none}
#topbar .tb-r{display:flex;gap:8px}
#topbar .topinfo{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;cursor:pointer;color:#fff;background:#ffffff14;border:1.5px solid #ffffff38}
#topbar .topinfo:hover,#topbar .topinfo:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--navy);outline:none}
#topbar .topshare{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;cursor:pointer;font:700 17px/1 var(--font);color:#fff;background:#ffffff14;border:1.5px solid #ffffff38}
#topbar .topshare:hover,#topbar .topshare:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--navy);outline:none}
#topbar .toplike{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;cursor:pointer;font:700 17px/1 var(--font);color:#fff;background:#ffffff14;border:1.5px solid #ffffff38}
#topbar .toplike:hover,#topbar .toplike:focus-visible{border-color:var(--gold);outline:none}
#topbar .toplike .hf{display:none}#topbar .toplike[aria-pressed="true"] .hf{display:block}#topbar .toplike[aria-pressed="true"] .ho{display:none}
#topbar .toplike[aria-pressed="true"]{border-color:#ff4d6d}
#topbar .toplike .lc:empty{display:none}
@media (max-width:479px){#topbar .topshare span{display:none}#topbar .topshare{width:38px;padding:0;justify-content:center}#topbar .back{padding:0 12px 0 8px}}
#howto{margin:auto;max-width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:22px 22px 18px;border:1.5px solid #ffffff26;border-radius:20px;background:#123a63;color:#fff;font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:text;-webkit-user-select:text}
#howto::backdrop{background:#04101ecc}
#howto h1{font:700 28px/1.1 var(--font);margin-bottom:10px;outline:none}
#howto h2{font:700 19px/1.2 var(--font);color:var(--gold);margin:4px 0 6px}
#howto ol,#howto ul{padding-left:20px;margin-bottom:12px}#howto li{margin-bottom:4px}
#howto p{color:#d6e6f5;font-size:14.5px}#howto p.cred{margin-top:8px;font-size:12.5px;opacity:.8}
#howto .close{margin-top:16px;width:100%;height:46px;border:0;border-radius:999px;cursor:pointer;font:700 18px/1 var(--font);color:var(--navy);background:linear-gradient(180deg,#ffe27a,#f7b60c)}
#toast{position:fixed;left:50%;bottom:calc(var(--adH) + 18px);transform:translate(-50%,20px);opacity:0;z-index:30;pointer-events:none;padding:10px 18px;border-radius:999px;background:#fff;color:var(--navy);font:700 16px/1 var(--font);box-shadow:0 8px 24px #0008;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#rank{margin:auto;width:min(420px,calc(100vw - 32px));padding:20px 20px 16px;border:1.5px solid #ffffff26;border-radius:20px;background:#123a63;color:#fff;font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#rank::backdrop{background:#04101ecc}
#rank h1{font:700 24px/1.15 var(--font);margin-bottom:10px;color:var(--gold)}
#rank ol{list-style:none;margin:0 0 10px;padding:0}
#rank li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:#ffffff12;margin-bottom:4px;font-weight:700}
#rank li.me{background:#ffd84d;color:var(--navy)}
#rank .rmsg{color:#d6e6f5;font-size:15px;margin:6px 0 10px}
#rank .ryou{font:700 18px/1.2 var(--font);margin:4px 0 10px}
#rank form.nk label{display:block;font-weight:700;margin-bottom:6px}
#rank form.nk input{width:100%;height:46px;border-radius:12px;border:2px solid #ffffff55;background:#0d2a4a;color:#fff;font:700 18px/1 system-ui,sans-serif;padding:0 12px;user-select:text;-webkit-user-select:text}
#rank form.nk input:focus{outline:none;border-color:var(--gold)}
#rank form.nk small{display:block;color:#d6e6f5;margin:6px 0 10px}
#rank .rbtn{width:100%;height:46px;border:0;border-radius:999px;cursor:pointer;font:700 18px/1 var(--font);color:var(--navy);background:linear-gradient(180deg,#ffe27a,#f7b60c);margin-top:6px}
#rank .rbtn.sec{background:#ffffff14;color:#fff;border:1.5px solid #ffffff38}
#adbar{position:fixed;left:0;right:0;bottom:0;height:var(--adH);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;background:var(--bg0);z-index:3;overflow:hidden}
#adbar .ad-slot{width:100%;max-width:728px;height:100%}

/* ---- jogo (palco 9:16) ---- */
#stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;border-radius:18px;touch-action:none;background:var(--sky);box-shadow:0 0 0 1px #ffffff1f,0 20px 60px #0008}
@media (max-width:520px){#stage{border-radius:0}}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);max-height:96%;overflow:auto;background:#0f2f55ee;border:3px solid #ffffffd9;border-radius:24px;padding:16px 16px 12px;text-align:center;pointer-events:auto;font-size:17px;color:#fff;box-shadow:0 10px 0 #0005}
.card button{display:block;width:100%;margin:8px 0;padding:13px 10px;font:700 18px/1.1 var(--font);border:0;border-radius:14px;cursor:pointer;color:#2a1306;background:linear-gradient(180deg,#ffe27a,#f7b60c);box-shadow:0 4px 0 #a86f00;touch-action:manipulation}
.card button:active{transform:translateY(2px);box-shadow:0 2px 0 #a86f00}
.card button.sec{color:#fff;background:#ffffff1f;box-shadow:inset 0 0 0 2px #ffffff55}
.card button:focus-visible{outline:4px solid #fff;outline-offset:2px}
.card .ctit{font:700 22px/1.15 var(--font);margin:2px 0 6px;color:#ffd84d}
.card input{width:100%;font:700 22px/1 var(--font);padding:10px;text-transform:uppercase;text-align:center;letter-spacing:4px;border-radius:12px;border:2px solid #ffffff66;background:#0a223f;color:#fff;user-select:text;-webkit-user-select:text}
.card input:focus{outline:none;border-color:var(--gold)}
.jrow{display:flex;gap:8px;align-items:center;margin:8px 0}.jrow input{flex:1.1;min-width:0}.jrow button{flex:1;margin:0}
.row{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.card .chip{display:inline-block;width:auto;flex:1;margin:0;padding:10px 12px;color:#fff;background:#ffffff1f;box-shadow:inset 0 0 0 2px #ffffff55}
.card .chip.on{color:#2a1306;background:linear-gradient(180deg,#ffe27a,#f7b60c);box-shadow:0 3px 0 #a86f00}
.card .hr{display:flex;align-items:center;gap:8px;color:#bcd3ea;font-size:14px;margin:10px 0 2px}.card .hr::before,.card .hr::after{content:'';flex:1;height:2px;background:#ffffff2e}
#roomTxt{font-size:16px;line-height:1.35;text-align:left;margin-bottom:6px}#roomTxt .rcode{text-align:center;font:700 20px/1.2 var(--font);margin-bottom:6px}#roomTxt .rcode b{color:#ffd84d;letter-spacing:3px;font-size:26px}
#roomTxt .rp{padding:5px 10px;border-radius:10px;background:#ffffff14;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#roomTxt .rw{text-align:center;margin-top:8px;color:#d6e6f5}
/* titulo: degrade dourado SEM chegar ao branco + contorno escuro (regra do site) */
.fancy{display:grid;place-items:center;line-height:1;white-space:nowrap;margin:0 0 2px}
.fancy>span{grid-area:1/1;position:relative;font:700 clamp(44px,13vw,64px)/1 var(--font);letter-spacing:1px}
.fancy .l0{color:#0d1430;-webkit-text-stroke:12px #0d1430;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45))}
.fancy .l2{background:linear-gradient(180deg,#ffe680 8%,#ffc93a 55%,#f08c00 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font:600 15px/1.2 var(--font);color:#d6e6f5;margin:12px 0 8px}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:3% 5% 5%;pointer-events:none}
#menu>*{pointer-events:auto}#menu .mlogo>span{font-size:clamp(40px,12vw,58px)}
#menuPet{flex:1 1 auto;width:72%;min-height:120px;position:relative;cursor:pointer;border-radius:24px;outline:none}#menuPet:focus-visible{box-shadow:0 0 0 4px #fff8}
#petHint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);white-space:nowrap;font:700 14px/1 var(--font);color:#fff;background:#0d1430b3;padding:6px 12px;border-radius:999px;animation:pul 1.2s ease-in-out infinite}
.msel{display:flex;align-items:center;gap:10px;margin-top:2px}.msel .arr{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font:700 32px/1 var(--font);color:#fff;background:#0d1430b3;box-shadow:0 3px 0 #0006}
.msel .mname{min-width:150px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 24px/1 var(--font);color:#fff;-webkit-text-stroke:5px #0d1430;paint-order:stroke fill}#mIcon{font-size:26px;-webkit-text-stroke:0}
.mtip{font:600 14px/1.25 var(--font);color:#fff;text-align:center;margin:6px 0 8px;padding:5px 12px;border-radius:12px;background:#0d143080;max-width:92%}
.mbox{width:100%;background:#0f2f55ee;border:3px solid #ffffffd9;border-radius:22px;padding:10px 12px;box-shadow:0 8px 0 #0005}
.mbox button{display:block;width:100%;border:0;border-radius:14px;cursor:pointer;color:#2a1306;background:linear-gradient(180deg,#ffe27a,#f7b60c);box-shadow:0 4px 0 #a86f00;font:700 18px/1.1 var(--font);padding:12px 8px;touch-action:manipulation}
.mbox button.big{padding:12px 8px 10px}.mbox button.big b{display:block;font:700 28px/1 var(--font)}.mbox button.big small{display:block;font:600 13px/1.2 var(--font);opacity:.8;margin-top:3px}
.mbox .mrow{display:flex;gap:8px;margin-top:9px}.mbox .mrow button{flex:1;min-height:48px}.mbox button.sec{color:#fff;background:#ffffff1f;box-shadow:inset 0 0 0 2px #ffffff55}
.mbox button:focus-visible{outline:4px solid #fff;outline-offset:2px}
/* nomes 3D somem enquanto a mensagem grande (resultado) esta na tela: nao tapam o placar */
#msg:not(:empty) ~ #tags{display:none}
#msg .sub{word-spacing:1px}
.nw{white-space:nowrap}
#result{top:auto;bottom:6%;transform:none}
#result .rtit{word-spacing:6px;font:700 30px/1.1 var(--font);color:#fff;-webkit-text-stroke:6px #0d1430;paint-order:stroke fill;margin:2px 0 8px}#result .rtit.win{color:#ffd84d}
#result .rsub{font:600 15px/1.45 var(--font);color:#d6e6f5;margin-bottom:4px}#result .rsub b{color:#fff}
#result .rwait{font:700 14px/1.3 var(--font);color:#ffd84d;min-height:0;margin:2px 0}#result .rwait:empty{display:none}
#result button:disabled{opacity:.75;cursor:default}
#hud{position:absolute;top:13%;left:0;right:0;text-align:center;font:700 32px/1 var(--font);color:#fff;-webkit-text-stroke:5px #0d1430;paint-order:stroke fill}
#dbg{position:absolute;left:4px;bottom:4px;font:12px monospace;color:#002;background:#fff8;padding:3px;white-space:pre}#dbg:empty{display:none}
.tag{position:absolute;transform:translate(-50%,-100%);font:700 12px/1 var(--font);color:#fff;-webkit-text-stroke:3px #0d1430;paint-order:stroke fill;white-space:nowrap;opacity:.95}
/* setinha 'voce' (3 s iniciais; pedido dele 2026-11-19: mais chamativa): ~2x, cor do jogador clareada, contorno escuro grosso, quique suave e brilho leve */
.tag.me::before{content:'\25BC';display:block;text-align:center;font-size:24px;line-height:1;color:color-mix(in srgb,currentColor 55%,#fff);-webkit-text-stroke:5px #0d1430;paint-order:stroke fill;filter:drop-shadow(0 0 5px color-mix(in srgb,currentColor 70%,#fff));margin-bottom:1px;animation:meb .7s ease-in-out infinite}
@keyframes meb{50%{transform:translateY(-6px)}}
#sc{position:absolute;left:3%;top:3%;max-width:70%;font:700 12px/1.2 var(--font);color:#fff;background:#0d1430aa;padding:4px 9px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:4px solid #fffa;border-radius:50%;background:#ffffff1a;pointer-events:none}
#knob{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fffd;box-shadow:0 2px 6px #0004;pointer-events:none}
#joy.rest,#knob.rest{opacity:.55}
#hint{position:absolute;white-space:nowrap;transform-origin:left center;font:700 20px/1 var(--font);color:#fff;-webkit-text-stroke:4px #0d1430;paint-order:stroke fill;animation:pul 1s ease-in-out infinite;pointer-events:none}
@keyframes pul{50%{transform:scale(1.12)}}
#msg{word-spacing:6px;position:absolute;top:38%;left:4%;right:4%;text-align:center;font:700 40px/1.1 var(--font);color:#ffd84d;-webkit-text-stroke:7px #0d1430;paint-order:stroke fill}
#msg .sub{font:700 16px/1.35 var(--font);-webkit-text-stroke:0;color:#fff;margin-top:12px;padding:8px 12px;background:#0d1430b3;border-radius:12px;display:inline-block}
#panel{position:absolute;right:2%;top:2%;width:62%;max-height:70%;overflow:auto;background:#fffe;color:#123;border-radius:12px;padding:8px;font:12px/1.3 system-ui,sans-serif;pointer-events:auto;user-select:text}
#panel label{display:block;margin:4px 0}#panel input{width:100%}#panel textarea{width:100%;font-size:10px}
#panel button{font-size:12px;padding:5px 8px}
#panel.min label,#panel.min textarea{display:none}
#dash{position:absolute;right:5%;bottom:8%;width:92px;height:92px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;
 background:conic-gradient(#ffd23f var(--p,100%),#ffffff33 0);box-shadow:0 4px 0 #0004;touch-action:none}
#dash span{width:74px;height:74px;border-radius:50%;background:#ff6b35;color:#fff;font:700 19px/1 var(--font);display:flex;align-items:center;justify-content:center;-webkit-text-stroke:3px #7a2a00;paint-order:stroke fill}
#dash.cool span{background:#8a8f99;-webkit-text-stroke-color:#444}#dash.press{transform:scale(.92)}
#dash.blink{animation:blk .5s 2}@keyframes blk{50%{transform:scale(1.15);filter:brightness(1.4)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#dash.lock span{background:#555;font-size:0}#dash.lock span::after{content:'';width:22px;height:18px;border-radius:3px;background:#ddd;display:block;position:relative;top:6px}
#dash.lock span::before{content:'';position:absolute;width:14px;height:14px;border:4px solid #ddd;border-bottom:0;border-radius:10px 10px 0 0;margin-top:-16px}
.tag.lead{font-size:13px}
#pos{position:absolute;left:4%;top:12%;font:700 44px/1 var(--font);color:#fff;-webkit-text-stroke:7px #0d1430;paint-order:stroke fill}
#bar{position:absolute;right:3%;top:20%;height:45%;width:8px;border-radius:4px;background:#fff8}
#bar i{position:absolute;left:-5px;width:18px;height:18px;margin-bottom:-9px;border-radius:50%;border:2px solid #fff;box-sizing:border-box}
#bar i.me{width:22px;height:22px;left:-7px;margin-bottom:-11px;border-width:3px}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%)}
#btoast{position:absolute;left:50%;top:22%;transform:translateX(-50%);max-width:92%;text-align:center;background:#0d1430d9;color:#fff;font:700 15px/1.25 var(--font);padding:7px 14px;border-radius:14px;pointer-events:none}
#panel .pre{margin-top:6px;border-top:1px solid #ccc;padding-top:4px}#preRow{display:flex;gap:3px;margin:4px 0}#preRow button{flex:1;padding:6px 0;background:#ddd;border:0;border-radius:6px;font-weight:700}
#preRow button.on{background:#2d6cdf;color:#fff}#preName{width:40%;font-size:12px}#preList{font-size:11px;color:#333;margin-top:3px}
#panel.min .pre{display:none}
#pick{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;padding:10% 3% 0}
#pick h2{margin:0 0 4%;font:700 28px/1.1 var(--font);color:#fff;-webkit-text-stroke:6px #0d1430;paint-order:stroke fill}
#pickGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:100%;box-sizing:border-box}
#pickGrid .pc{position:relative;aspect-ratio:3/4;border:3px solid #fff6;border-radius:16px;background:transparent;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-family:inherit;cursor:pointer}
#pickGrid .pc b{font:700 12px/1.2 var(--font);background:#fffe;border-radius:10px;padding:2px 6px;margin-bottom:4px;white-space:nowrap;-webkit-text-stroke:0}
#pickGrid .pc i{position:absolute;top:4px;left:0;right:0;font-style:normal;font:700 11px/1.1 var(--font);color:#fff;-webkit-text-stroke:3px #0d1430;paint-order:stroke fill}
#pickGrid .pc.on{border-color:#fff;box-shadow:0 0 0 3px #ffd23f,0 6px 0 #0003;transform:scale(1.04)}
#pickGrid .pc.taken{opacity:.45}
#pickOk{margin-top:6%;width:80%;padding:16px;font:700 20px/1.1 var(--font);border:0;border-radius:16px;cursor:pointer;color:#2a1306;background:linear-gradient(180deg,#ffe27a,#f7b60c);box-shadow:0 5px 0 #a86f00}
#pickOk:disabled{background:#8a9bb5;box-shadow:none;color:#fff}
#load{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);background:#0d1430b3;color:#fff;font:700 14px/1 var(--font);padding:7px 14px;border-radius:14px;pointer-events:none;white-space:nowrap}
